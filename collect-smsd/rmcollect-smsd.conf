# app.run_as_user                     = cdrmunch
# app.run_as_group                    = cdrmunch

# max core size in mega bytes
app.max_core_size_mega_bytes          = 300

# core file location ( affects system wide )
app.core_dump_dir                     = /tmp

# nice number for the process ( set to 'false' to disable )
app.niceness                          = 10

# data directory
app.data_dir                          = /var/lib/archiving

# directory where FreeSWITCH puts smss
sms.directory                         = /mnt/cdrfs/archiving-import-sms

# number of sms inspector threads
sms_handler.number_of_threads         = 2

# collect-smsd temp data directory
temp_files.base_directory             = /var/lib/archiving/collect-smsd

# ArchiveD listen port
archived_client.server_port           = 10100

# ArchiveD host name
archived_client.server_host           = archived.redmatter.com

# CoreAPI hostname
coreapi.url = http://api.redmatter.com
# CoreAPI hash for a system user
coreapi.auth_hash = 48d9a6fe064e5ad511fb14f3629d0a5b43ffd91c73f6318a63e53cc061d9ce60d03dfaf7d00dc518

# turn-off _safe wrapper restarts
debug.disable_restart                 = false

# debug options; not ideal for production environment
debug.valgrind_enabled                = false
debug.valgrind_log_file               = /var/log/archiving-collect-smsd_valgrind.log
debug.valgrind_generate_suppressions  = true
debug.valgrind_track_file_descriptors = true
debug.valgrind_tool                   = memcheck
debug.malloc_check                    = 0

# Logfile
log.file_path                         = syslog
log.level                             = 4

# include files from config dir
include_dir                           = /etc/archiving/conf.d
