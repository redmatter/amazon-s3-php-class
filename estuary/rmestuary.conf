# ArchiveD listen port
archived_client.server_port = 10100
# ArchiveD host name
archived_client.server_host = archived.{hapi:SearchDomain}

# HTTP listen address
http_server.listen_address = 0.0.0.0
# HTTP listen port
http_server.listen_port = 8010

# Number of connections to ArchiveD
# estuary.archived_connections = 2

# user / group to run the daemon as
app.run_as_user                       = cdrmunch
app.run_as_group                      = cdrmunch

# max core size in mega bytes
app.max_core_size_mega_bytes          = 300

# max number of file handles
app.max_file_handles = 1024

# core file location ( affects system wide )
app.core_dump_dir                     = /tmp

# nice number for the process ( set to 'false' to disable )
app.niceness                          = 10

# turn-off _safe wrapper restarts
debug.disable_restart                 = false
debug.disable_restart@qa              = true
debug.disable_restart@dev             = true

# restart event notification
app.on_restart_notify_emails          = dino@redmatter.com,root@redmatter.com
app.on_restart_notify_emails@dev      = root@redmatter.com

# debug options; not ideal for production environment
debug.valgrind_enabled                = false
debug.valgrind_log_file               = /var/log/archiving-estuary_valgrind.log
debug.valgrind_generate_suppressions  = true
debug.valgrind_track_file_descriptors = true
debug.valgrind_tool                   = memcheck
debug.malloc_check                    = 0

# include files from config dir
include_dir                           = /etc/archiving/conf.d

# Don't kill archiving-estuary after stop, let the operator decide
app.sigkill_after_stop_wait = false

# Logging
log.file_path = syslog
log.level = 6
log.level@prod = 4
log.facility = LOG_LOCAL0
