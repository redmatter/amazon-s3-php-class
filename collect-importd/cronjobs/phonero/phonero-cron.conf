# logging related settings; leave the file_path below as-is for logging to /var/log/archiving-export.log
log.file_path = syslog
log.level = 5

# do not touch these unless you what you are doing
app.keep_temp_files = false
app.include_path = archiving

# config relating to the application functionality

# the phonero SFTP server
phonero.host            = ftp.phonero.no
phonero.username        = natterbox
phonero.password        = eeVaiZoh2eiz3Vai5eiyeeWeeh8shee8
phonero.remote_dir      = upload

# regex file matcher for relevant phonero files
phonero.filename_regex  = /^([0-9]+_)+[0-9\-]+_[0-9]+\.mp3$/

# files are initially tranferred via SFTP to here
phonero.download_dir    = /mnt/rmfs/phonero/download

# when the transfer is complete and the remote file is deleted, files are moved here
phonero.queue_dir       = /mnt/rmfs/phonero/queue

# when the API has processed the file but there are no subscriber matches, files are moved here
phonero.not_handled_dir = /mnt/rmfs/phonero/not-handled

# this directory is where processed files go, and is monitored by collect-importd
phonero.import_dir      = /mnt/rmfs/archiving-import

# core API creds
phonero.coreapi_url     = http://api.{hAPI:SearchDomain}
phonero.coreapi_creds   = YXJjaGl2aW5nOkQhbjBJNTdoM01ANXQzcjBGQHJjaCF2IW5n

# maximum size of queue sent to archive
phonero.hi_water_mark   = 100

# A regex (skip_regex) is defined below. This is compared to a string with
# the <HAPI LocName>-<wallclock minutes>. If there is a match, the session
# aborts. This is to prevent more than one instance accessing the same SFTP site simultaneously.
# This setting aborts sessions running on S01 on even minutes, and S02 on odd minutes
phonero.skip_regex      = /^((S01-[0-5][02468])|(S02-[0-5][13579]))$/
