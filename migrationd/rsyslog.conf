$FileGroup viewlogs
$ActionName log_migrationd
if $programname == 'rm-migrationd' then /var/log/archiving-migrationd.log
$ActionName discard_migrationd
if $programname == 'rm-migrationd' then ~

$ActionName log_verify-migration
if $programname == 'rm-verify-migration' then /var/log/archiving-verify-migration.log
$ActionName discard_verify-migration
if $programname == 'rm-verify-migration' then ~
$FileGroup adm
