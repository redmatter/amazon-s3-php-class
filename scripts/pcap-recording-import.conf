@require = /etc/archiving/conf.d/internal_database.conf
@require = /etc/archiving/conf.d/retention_database.conf
@require = /etc/archiving/conf.d/big_database.conf

# API details; use archiving user here
#api.authorization_hash = d309164faa56c9b9fd1327319e560d84e38e369b09c54d1ee9c7ec200c4d74c50a16d6aa67253669
api.authorization_creds = YXJjaGl2aW5nOkQhbjBJNTdoM01ANXQzcjBGQHJjaCF2IW5n
api.base_url = http://api.{hapi:SearchDomain}

# ArchiveD HTTP interface to get PCAPs
archived.base_url = http://archived.{hapi:SearchDomain}

pcap_import.csv_dir = /var/lib/archiving/pcap-import

# logging
log.file_path = syslog
log.level = 6

# do not touch these unless you what you are doing
app.include_path = archiving:rmapp

# pid file path
app.pid_file = /var/run/archiving/rmarchpcapimport.pid
app.temp_dir = /tmp/pcap-import

# run daemon as
app.run_as_user = cdrmunch
app.run_as_group = cdrmunch
