@require = /etc/archiving/conf.d/internal_database.conf
@require = /etc/archiving/conf.d/retention_database.conf

# API details; use archiving user here
api.authorization_hash = d309164faa56c9b9fd1327319e560d84e38e369b09c54d1ee9c7ec200c4d74c50a16d6aa67253669
api.base_url = http://api.{hapi:SearchDomain}

# logging
log.file_path = syslog
log.level = 6

# do not touch these unless you what you are doing
app.include_path = archiving

# pid file path
app.pid_file = /var/run/archiving/rmarchpolfix.pid

# run daemon as
app.run_as_user = cdrmunch
app.run_as_group = cdrmunch
