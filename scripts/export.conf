@require = /etc/archiving/scripts-retention_rw.conf

coreapi.authorization_creds = YXJjaGl2aW5nOkQhbjBJNTdoM01ANXQzcjBGQHJjaCF2IW5n
coreapi.url = http://api.{hapi:SearchDomain}
coreapi.logsexportq.aeskey = _!RM3nCryptXp0rta3s98234sdf23153453462-*/s8g

export.zipfilesizelimitmb = 500

# logging related settings; leave the file_path below as-is for logging to /var/log/archiving-export.log
log.file_path = syslog
log.level = 5

# do not touch these unless you what you are doing
app.keep_temp_files = false
app.include_path = archiving

# ArchivingSQL connector
mysql_coresql.database    = Archiving
mysql_coresql.host        = {hapidb:cdruser:Archiving:hostname}
mysql_coresql.username    = {hapidb:cdruser:Archiving:username}
mysql_coresql.password    = {hapidb:cdruser:Archiving:password}
mysql_coresql.port        = 3306
mysql_coresql.ssl_enabled = false
mysql_coresql.ssl_key     =
mysql_coresql.ssl_cert    =
mysql_coresql.ssl_ca      =
mysql_coresql.ssl_capath  =
