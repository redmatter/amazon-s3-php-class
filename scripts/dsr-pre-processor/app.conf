@require = /etc/archiving/conf.d/internal_database.conf
@require = /etc/archiving/conf.d/retention_database.conf

# How often does the app iterate
app.run_interval_seconds = 60

# How often is legal-hold cache updated
legal_hold.cache_update_interval_seconds = 600

# how often notifications are cecked
dsr_notifications.check_interval_seconds = 300

# policy lookup cache
cache.auto_approved_policies_ttl_seconds = 600

# logging
log.file_path = syslog
log.level = 5

# do not touch these unless you what you are doing
app.include_path = archiving:rmapp

api.base_url = http://api.{hapi:SearchDomain}
api.authorization_creds = YXJjaGl2aW5nOkQhbjBJNTdoM01ANXQzcjBGQHJjaCF2IW5n

dgapi.base_url = http://dgapi.{hapi:SearchDomain}
