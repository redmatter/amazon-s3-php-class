# Org ID
extract.org_id = 1

# Number of SMS Logs to attempt to repair in each batch
extract.batch_size = 100

# Maximum number of batches to perform (0 means no limit)
extract.max_batches = 0

# API details; use archiving user here
# To get archiving user authorisation hash:
# SELECT CONCAT(`EncUsername`, `EncPassword`) FROM `Org`.`Users` WHERE `Username` = 'archiving'
#api.authorization_hash = 40bd001563085fc35165329ea1ff5c5ecbdbbeef5f6955d227a320c7f1f6c7da2a6d96a851a8118f
api.authorization_creds = YXJjaGl2aW5nOkQhbjBJNTdoM01ANXQzcjBGQHJjaCF2IW5n
api.base_url = http://api.{hapi:SearchDomain}

# logging related settings; leave the file_path below as 'syslog' for logging to /var/log/archiving-sms-recovery.log
log.file_path = syslog
log.level = 5

# do not touch these unless you what you are doing
app.include_path = archiving

# CoreSQL connector
mysql_coresql.database    = Archiving
mysql_coresql.host        = {hapidb:cdruser:Archiving:hostname}
mysql_coresql.username    = {hapidb:cdruser:Archiving:username}
mysql_coresql.password    = {hapidb:cdruser:Archiving:password}
mysql_coresql.port        = 3306
mysql_coresql.ssl_enabled = false
mysql_coresql.ssl_key     =
