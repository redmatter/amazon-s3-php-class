# filetypes to fix; 'all' for all otherwise a comma seperated list
dataset.filetype = cdr

# Org ID
dataset.org_id = 1

# the files would appear as if they were created on this date (YYYY-MM-DD format or 'now')
dataset.creation_date = now

# batch-size for the run
dataset.batch_size = 1000

# policy-id under which the files are to be stored
dataset.policy_id = 0

# use the legacy meta-data header set
dataset.legacy_headers = false

# make metadata headers that mismatch with those in retention database
dataset.introduce_errors = false

# --------------- 

# API details; use archiving user here
#api.authorization_hash = d309164faa56c9b9fd1327319e560d84e38e369b09c54d1ee9c7ec200c4d74c50a16d6aa67253669
api.authorization_creds = YXJjaGl2aW5nOkQhbjBJNTdoM01ANXQzcjBGQHJjaCF2IW5n
api.base_url = http://api.{hapi:SearchDomain}

# --------------- 

# logging related settings; leave the file_path below as 'syslog' for logging to /var/log/archiving-makepurgedata.log

log.file_path = syslog
log.level = 6

# do not touch these unless you what you are doing
app.include_path = archiving

@require = /etc/archiving/scripts-retention_ro.conf
@require = /etc/archiving/scripts-retention_rw.conf

