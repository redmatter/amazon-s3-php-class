@require = /etc/archiving/scripts-retention_ro.conf
@require = /etc/archiving/scripts-retention_rw.conf

# filetypes to fix; 'all' for all otherwise a comma seperated list
dataset.filetype = cdr

# Org IDs to fix; 'all' for all
dataset.org_ids = 1

# the files would appear as if they were created on this date
dataset.creation_date = 2011-12-01

# batch-size for the run
dataset.batch_size = 1000

# policy-id under which the files are to be stored
dataset.policy_id = 0

# API details; use archiving user here
api.authorization_hash = d309164faa56c9b9fd1327319e560d84e38e369b09c54d1ee9c7ec200c4d74c50a16d6aa67253669
api.base_url = http://api.dk.redmatter.com

# logging related settings; leave the file_path below as 'syslog' for logging to /var/log/archiving-headerspatch.log

log.file_path = syslog
log.level = 6

# do not touch these unless you what you are doing
app.include_path = archiving
