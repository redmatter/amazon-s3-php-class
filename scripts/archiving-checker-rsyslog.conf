#:programname, isequal, "rm-archiving-checker" /var/log/coreapi.log

$FileGroup viewlogs
$ActionName log_archiving-checker
if $programname == 'rm-archiving-checker' then -/var/log/archiving-checker.log
$ActionName discard_archiving-checker
if $programname == 'rm-archiving-checker' then ~
$FileGroup adm

