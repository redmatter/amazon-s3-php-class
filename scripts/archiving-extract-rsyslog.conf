#:programname, isequal, "rm-archiving-extract" /var/log/coreapi.log

$FileGroup viewlogs
$ActionName log_archiving-extract
if $programname == 'rm-archiving-extract' then -/var/log/archiving-extract.log
$ActionName discard_archiving-extract
if $programname == 'rm-archiving-extract' then ~
$FileGroup adm

