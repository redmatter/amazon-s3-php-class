# mysql database name
mysql_retention.database                         = ArchivingRetention

# mysql hostname
mysql_retention.host                             = sql-rw.redmatter.com

# mysql username
mysql_retention.username                         = archiving

# mysql password
mysql_retention.password                         =

# mysql port number
mysql_retention.port                             = 3306

# mysql SSL enable
mysql_retention.ssl_enabled                      = false

# mysql SSL key
mysql_retention.ssl_key                          =

# mysql SSL cert
mysql_retention.ssl_cert                         =

# mysql SSL ca
mysql_retention.ssl_ca                           =

# mysql SSL capath
mysql_retention.ssl_capath                       =

# mysql SSL cipher
mysql_retention.ssl_cipher                       =

# a connection if idle for this amount of time, will be closed
mysql_retention.connection_max_idle_time_seconds = 300

# max db connection pool size
mysql_retention.connection_pool_size             = 16

# timezone set on every new connection
mysql_retention.default_time_zone                = +00:00

mysql_retention.debug_enabled                    = true
mysql_retention.debug_enabled@prod               = false
