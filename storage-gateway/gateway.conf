# how deep to keep UUIDs (meant to help get around filesystem folder limits)
# a value of 0 disables it; max level is 10
storage.path_uuid_levels = 3

# base path for storing objects
storage.base_path = /mnt/rmfs/storage-gateway

# logging settings
log.file_path = syslog
log.level = 4

# authentication settings
# where authentication details are kept
authentication.data_file_path = /usr/share/storage-gateway/auth_data.xml