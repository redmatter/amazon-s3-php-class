# app.run_as_user                     = cdrmunch
# app.run_as_group                    = cdrmunch

# max core size in mega bytes
app.max_core_size_mega_bytes          = 300

# core file location ( affects system wide )
app.core_dump_dir                     = /tmp

# nice number for the process ( set to 'false' to disable )
app.niceness                          = 10

# data directory
app.data_dir                          = /var/lib/archiving

# restart event notification
app.on_restart_notify_emails          = dino@redmatter.com,ops@redmatter.com
app.on_restart_notify_emails@dev      = dino@redmatter.com

# directory where FreeSWITCH puts cdr
cdr.directory                         = __PATH__/xml_cdr

# pcaps handling enabled
pcap.enabled                          = true

# directory where FreeSWITCH puts PCAPs
pcap.directory                        = __PATH__/pcap

# chunk handling enabled
chunk.enabled                         = false

# directory where FreeSWITCH puts chunked recordings
chunk.directory                       = __PATH__/chunk

# info file handling enabled
info.enabled                          = false

# directory where FreeSWITCH puts info files
info.directory                        = __PATH__/chunkinfo

# OrgIDs for which filter is turned on
cdr_handler.filter_orgs               =

# honour variable rmCDRDiscard in CDRs
cdr_handler.honour_cdr_variable_rmCDRDiscard = true

# filtered xpaths in CDRs
cdr_handler.filtered_xpaths           =

# number of cdr inspector threads
cdr_handler.number_of_threads         = 2

# archiving enabled orgs; for phased rollout
cdr_handler.archiving_enabled_orgs    = all

# CDR directory loading interval in seconds
directory_loader.interval_seconds     = 30

# CDR directory loading chunked by this much
directory_loader.batch_size           = 50

# collectd temp data directory
temp_files.base_directory             = /var/lib/archiving/collectd

# ArchiveD listen port
archived_client.server_port           = 10100

# ArchiveD host name
archived_client.server_host           = archived.{hapi:SearchDomain}

archived_connection_pool.max_connections = 16
archived_connection_pool.max_connections@dev = 4
archived_connection_pool.max_connections@qa = 4

# Maximum age in minutes for done items
purge.done_items_max_age_minutes      = 3
# Maximum age
purge.max_age_days                    = 10

# Purge batch size
purge.batch_size                      = 500
# Purge frequency
purge.frequency_minutes               = 1


# turn-off _safe wrapper restarts
debug.disable_restart                 = false
debug.disable_restart@qa              = true
debug.disable_restart@dev             = true

# debug options; not ideal for production environment
debug.valgrind_enabled                = false
debug.valgrind_log_file               = /var/log/archiving-collectd_valgrind.log
debug.valgrind_generate_suppressions  = true
debug.valgrind_track_file_descriptors = true
debug.valgrind_tool                   = memcheck
debug.malloc_check                    = 0

# Logfile
log.file_path                         = syslog
log.level                             = 4
log.level@dev                         = 6
log.level@qa                          = 6

# include files from config dir
include_dir                           = /etc/archiving/conf.d

# wait this long (seconds) if shutdown hangs
app.seconds_to_wait_before_kill = 20
# Kill with -9 if stop fails and wated for app.seconds_to_wait_before_kill
app.sigkill_after_stop_wait = false
