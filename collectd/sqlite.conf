# Max sessions to the queue database
sqlite.session_pool_size = 3

# Max seconds before we kill a free session
sqlite.session_max_dormant_seconds = 60

# Path to the database file
sqlite.database_path = /var/lib/archiving/collectd.db3

# Database SQL debug on/off
sqlite.debug_on = true

# Queue save (to db) interval in seconds
queue.save_interval_seconds = 5

