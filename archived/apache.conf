<IfModule !mod_proxy.c>
	LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !mod_proxy_fcgi.c>
	LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
</IfModule>
ProxyRequests Off

<VirtualHost *:80>
	ServerName  archived
	ServerAlias archived.*

	SetEnv proxy-fcgi-pathinfo=1	
	
	ProxyPass / fcgi://127.0.0.1:10101/

	LogFormat "%a \"%r\" %>s %b %D %200,201,202,203,204{Authorized}i %!200,201,202,203,204,304{User-agent}i" rm_access_log
	CustomLog "|/usr/bin/logger -t rm-archived -p local0.info" rm_access_log
	ErrorLog  "|/usr/bin/logger -t rm-archived -p local0.info"
</VirtualHost>
