<VirtualHost *:80>
	ServerName  archived
	ServerAlias archived.*

	DocumentRoot /var/www/rmarchived

	DirectoryIndex get.fcgi

	FastCGIExternalServer /var/www/rmarchived/get.fcgi -host 127.0.0.1:10101
	Alias / /var/www/rmarchived/get.fcgi/

	RewriteRule ^/get.fcgi$ get.fcgi/ [R]

	LogFormat "%a \"%r\" %>s %b %D %200,201,202,203,204{Authorized}i %!200,201,202,203,204,304{User-agent}i" rm_access_log
	CustomLog "|/usr/bin/logger -t rm-archived -p local0.info" rm_access_log
	ErrorLog  "|/usr/bin/logger -t rm-archived -p local0.info"

	<Directory "/var/www/rmarchived/">
		AllowOverride All
		Order deny,allow
		Deny from all
		Allow from 127.0.0.0/8
		Allow from 10.0.0.0/8
		Allow from 172.30.98.0/23
		Allow from 192.168.70.0/24
		Allow from 192.168.77.0/24
		Options +ExecCGI
	</Directory>

</VirtualHost>
