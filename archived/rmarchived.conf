# run daemon as
app.run_as_user = cdrmunch
app.run_as_group = cdrmunch

# core dumps
app.max_core_size_mega_bytes = 1024
app.core_dump_dir = /tmp

# max file handles
app.max_file_handles = 1024

# nice number for the process ( set to 'false' to disable )
app.niceness = 10

# data directory
app.data_dir = /var/lib/archiving

# restart event notification
app.on_restart_notify_emails = dino@redmatter.com,ops@redmatter.com

# ArchiveD service threads
archived.service_threads = 6

# Number of converter threads
converter.threads = 4

# location shared for call-buffering between rmarchived and freeSWITCH scripts
call_buffering.base_dir = /mnt/rmfs/call-buffering

# Use SSL for S3 connection
s3_backend.ssl_enabled = true
# S3 runner threads
s3_runner.threads = 4


# CoreAPI hostname
coreapi.url = http://api.redmatter.com
# CoreAPI hash for a system user
# coreapi.auth_hash = 48d9a6fe064e5ad511fb14f3629d0a5b43ffd91c73f6318a63e53cc061d9ce60d03dfaf7d00dc518
coreapi.auth_hash = d309164faa56c9b9fd1327319e560d84e38e369b09c54d1ee9c7ec200c4d74c50a16d6aa67253669

# Distiller port
distiller_client.server_port = 10001

# Distiller host
distiller_client.server_host = cdrmunch.redmatter.com

# retention data - flush interval in seconds
retention_data.flush_interval_seconds = 10

# ArchiveD ports
archived.put_port = 10100


# GET server fcgi listen port
get_server.fcgi_listen_socket = :10101

# GET server fcgi listen queue
get_server.fcgi_listen_queue_depth = 100

# GET server threads
get_server.handler_threads = 2

# GET server fcgi debug enabled?
get_server.debug = false


# Require approval before real purge
retention_purge.require_approval = true

# Completely delete CDR records?
retention_purge.delete_cdr_retention_records = true

# purge database flush interval
retention_purge.db_flush_interval_seconds = 30

# purge date will lag by this many days
retention_purge.lag_days = 7

# approval reload every this many minutes
retention_purge.approval_run_interval_minutes = 1

# purge files created within this range
retention_purge.creation_date_range_start = 2012-01-09 

# purge files created within this range
retention_purge.creation_date_range_end = 2012-01-15 

# factor in endpoint's (S3 only at the moment) auto-expiration capability
retention_purge.auto_expiring_filetypes = 

# purge enabled orgs; 'all' for every org, or a comma seperated list of OrgIDs; blank for none
retention_purge.enabled_orgs = 1,274


# Logfile
log.file_path = syslog
log.level = 4

# include files from config dir
include_dir = /etc/archiving/conf.d

# Clear-cache enabled?
clear_cache.enabled = false

# -- Filesystem paths --

# ArchiveD file cache
archived.cache_dir = /var/lib/archiving/cache
# base directory in which 'clear' files will be stored
clear_cache.base_directory = /var/lib/archiving/archived/clear-cache
# Path where whispered CDRs are stored
distiller_client.base_dir = /var/spool/cdrtmp/cdrmunch-cache

# -- debug --

# turn-off _safe wrapper restarts
debug.disable_restart = false

# debug options; not ideal for production environment
debug.valgrind_enabled = false
debug.valgrind_log_file = /var/log/archiving-archived_valgrind.log
debug.valgrind_generate_suppressions = true
debug.valgrind_track_file_descriptors = true
debug.valgrind_tool = memcheck
debug.malloc_check = 0

