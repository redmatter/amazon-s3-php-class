# run daemon as
app.run_as_user = cdrmunch
app.run_as_group = cdrmunch

# core dumps
app.max_core_size_mega_bytes = 1024
app.core_dump_dir = /tmp

# max file handles
app.max_file_handles = 1024

# nice number for the process ( set to 'false' to disable )
app.niceness = 10

# data directory
app.data_dir = /var/lib/archiving

# restart event notification
app.on_restart_notify_emails = dino@redmatter.com,ops@redmatter.com
app.on_restart_notify_emails@qa = dino@redmatter.com,qa@redmatter.com
app.on_restart_notify_emails@dev = root@redmatter.com

# ArchiveD service threads
archived.service_threads = 48

# Number of converter threads
converter.threads = 4

# location shared for call-buffering between rmarchived and freeSWITCH scripts
call_buffering.base_dir = /mnt/rmfs/call-buffering

# Use SSL for S3 connection
s3_backend.ssl_enabled = true
# S3 runner threads
s3_runner.threads = 8
s3_runner.threads@dev   = 2
s3_runner.threads@qa    = 2
s3_runner.threads@stage = 2


# CoreAPI hostname
coreapi.url = http://api.{hapi:SearchDomain}

# CoreAPI hash for a system user
#coreapi.auth_hash = d309164faa56c9b9fd1327319e560d84e38e369b09c54d1ee9c7ec200c4d74c50a16d6aa67253669

# CoreAPI creds for a system user
coreapi.auth_creds = YXJjaGl2aW5nOkQhbjBJNTdoM01ANXQzcjBGQHJjaCF2IW5n

# Distiller port
distiller_client.server_port = 10001

# Distiller host
distiller_client.server_host = cdrmunch.{hapi:SearchDomain}

# retention data - flush interval in seconds
retention_data.flush_interval_seconds = 10

# ArchiveD ports
archived.put_port = 10100


# fcgi listen port
fcgi_server.listen_socket = :10101

# fcgi listen queue
fcgi_server.listen_queue_depth = 100

# fcgi server threads
fcgi_server.handler_threads = 8

# fcgi debug enabled?
fcgi_server.debug = false


# Require approval before real purge
retention_purge.require_approval = false

# Completely delete CDR records?
retention_purge.delete_cdr_retention_records = true

# purge database flush interval
retention_purge.db_flush_interval_seconds = 30

# purge date will lag by this many days
retention_purge.lag_days = 7

# approval reload every this many minutes
retention_purge.approval_run_interval_minutes = 1

# purge files created within this range
retention_purge.creation_date_range_start =

# purge files created within this range
retention_purge.creation_date_range_end = 2015-09-30

# factor in endpoint's (S3 only at the moment) auto-expiration capability
retention_purge.auto_expiring_filetypes = 

# file-type(s) for which purge is enabled ( see common/types.cpp for the list supported )
retention_purge.enabled_filetypes = buffered-recording

# purge enabled orgs; 'all' for every org, or a comma seperated list of OrgIDs; blank for none
retention_purge.enabled_orgs = all
retention_purge.enabled_orgs@qa = all
retention_purge.enabled_orgs@dev = all
retention_purge.enabled_orgs@stage = all

# deficient s3 headers are not present beyond this date
# (based on QA Handovers http://trac.redmatter.com/wiki/QAHandover_14_02_2012)
retention_purge.legacy_s3_headers_last_date = 2012-02-15

# bypass headers check; options are a comma delimited list of
# - non-internal-filetype-with-legacy-headers
# - internal-filetype-with-legacy-headers
# - any-filetype-with-legacy-headers
# - non-internal-filetype
# - internal-filetype
# - any-filetype ( this will override all, if present )
# - none ( this will override all, if present )
# Here internal filetypes are CDRs and both PCAP types
retention_purge.bypass_headers_check_for = internal-filetype-with-legacy-headers

# Logfile
log.file_path = syslog
log.level = 4
log.level@qa = 6
log.level@dev = 6

# include files from config dir
include_dir = /etc/archiving/conf.d

# Clear-cache enabled?
clear_cache.enabled = false

# -- Filesystem paths --

# ArchiveD file cache
archived.cache_dir = /var/lib/archiving/cache
archived.cache_dir.min_free_space_KB     = 500000
archived.cache_dir.min_free_space_KB@qa  = 50000
archived.cache_dir.min_free_space_KB@dev = 5000

# base directory in which 'clear' files will be stored
clear_cache.base_directory = /var/lib/archiving/archived/clear-cache
clear_cache.base_directory.min_free_space_KB     = 500000
clear_cache.base_directory.min_free_space_KB@qa  = 50000
clear_cache.base_directory.min_free_space_KB@dev = 5000

# Path where whispered CDRs are stored
distiller_client.base_dir = /var/spool/cdrtmp/cdrmunch-cache
distiller_client.base_dir.min_free_space_KB     = 500000
distiller_client.base_dir.min_free_space_KB@qa  = 50000
distiller_client.base_dir.min_free_space_KB@dev = 5000


# -- debug --

# turn-off _safe wrapper restarts
debug.disable_restart = false
debug.disable_restart@qa = true

# debug options; not ideal for production environment
debug.valgrind_enabled = false
debug.valgrind_log_file = /var/log/archiving-archived_valgrind.log
debug.valgrind_generate_suppressions = true
debug.valgrind_track_file_descriptors = true
debug.valgrind_tool = memcheck
debug.malloc_check = 0
# uncomment the line below, along with debug.valgrind_enabled=true to enable gdb debugging for errors found
# debug.valgrind_extra_options = --vgdb=yes --vgdb-error=1

# wait this long (seconds) if shutdown hangs
app.seconds_to_wait_before_kill = 30

