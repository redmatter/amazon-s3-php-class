<VirtualHost *:80>
	ServerName agw
	ServerAlias agw.*
	DocumentRoot /var/www/rmarchgateway
	AllowEncodedSlashes On
	php_admin_value auto_prepend_file "/var/www/rmarchgateway/xhprof_pre.php"
</VirtualHost>

<Directory "/var/www/rmarchgateway/">
	AllowOverride All
	Order deny,allow
	Deny from all
	Allow from 10.0.0.0/8
	Allow from 172.30.98.0/23
	Allow from 127.0.0.0/8

	RewriteEngine On
	RewriteBase /
	RewriteRule ^(sql|system|inc|bin|session) - [F,L]
	RewriteCond %{REQUEST_FILENAME} !-f
	RewriteCond %{REQUEST_FILENAME} !-d
	RewriteRule .* index.php/$0 [L]
</Directory>
