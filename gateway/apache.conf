<VirtualHost *:80>
	ServerName agw
	ServerAlias agw.*
	DocumentRoot /var/www/rmarchgateway
	AllowEncodedSlashes On
</VirtualHost>

<Directory "/var/www/rmarchgateway/">
	AllowOverride All
	Order deny,allow
	Deny from all
	Allow from 10.0.0.0/8
	Allow from 172.30.98.0/23
	Allow from 192.168.69.0/24
	Allow from 192.168.70.0/24
	Allow from 127.0.0.0/8
	Allow from 84.45.30.0/23
	Allow from 82.198.240.176/28

	RewriteEngine On
	RewriteBase /
	RewriteRule ^(sql|system|inc|bin|session) - [F,L]
	RewriteCond %{REQUEST_FILENAME} !-f
	RewriteCond %{REQUEST_FILENAME} !-d
	RewriteRule .* index.php/$0 [L]
</Directory>
