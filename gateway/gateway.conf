# how deep to keep keys (meant to help get around filesystem folder limits)
# a value of 0 disables it; max level is 10
storage.path_key_levels = 3

# base path for storing objects
storage.base_path = /tmp

# ( on remote filesystems ) disable flock?
storage.lock_disable_flock = false

# include paths for auto-loader
app.include_path = rmapp:fluid:rmarchgateway

# logging settings
log.file_path = syslog
log.level = 6

@require = /usr/share/fluid/base.conf

# authentication settings
# where authentication details are kept
authentication.data_file_path = /usr/share/archiving/auth_data.xml.sample

include_dir = /etc/archiving/gateway.d